<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171919">
<title>Move Strong: 24-Week Beginner Programme</title>
<style>
:root{
  --bg:#101212;--panel:#171a1a;--panel2:#1d2120;--line:#343b39;
  --text:#f4f7f2;--muted:#aeb8b1;--green:#7ebb46;--green2:#abca3c;
  --orange:#f0a14a;--red:#ef655a;--blue:#63a8ff;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:auto;min-height:100vh}
header{
 position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
 padding:14px 18px;background:rgba(16,18,18,.96);border-bottom:1px solid var(--line);
 backdrop-filter:blur(12px)
}
.brand{display:flex;align-items:center;gap:12px;min-width:230px}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--green),var(--green2));color:#10200a;font-weight:1000;display:grid;place-items:center}
h1,h2,h3,p{margin-top:0}
h1{font-size:20px;margin:0}.sub{font-size:11px;color:var(--muted)}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#222826;color:var(--text);padding:10px 13px;border-radius:12px;font-weight:800}
.btn:hover{border-color:#56625c}.btn.primary{background:var(--green);color:#12200c;border-color:var(--green)}
.btn.danger{background:#3a201f;border-color:#6c3936}.btn.ghost{background:transparent}.btn.small{padding:7px 9px;font-size:12px}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 77px)}
nav{border-right:1px solid var(--line);padding:14px;position:sticky;top:77px;height:calc(100vh - 77px)}
nav button{display:block;width:100%;text-align:left;margin:5px 0;padding:11px 12px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:800}
nav button.active{background:#29411e;color:#f4fff0}
main{padding:18px;min-width:0}
.page{display:none}.page.active{display:block}
.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px}
.card h2{font-size:19px;margin-bottom:8px}.card h3{font-size:16px;margin-bottom:7px}
.muted{color:var(--muted)}.tiny{font-size:11px}.green{color:var(--green2)}.red{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #435044;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;color:#dce7d9;background:#202620}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hero{background:linear-gradient(145deg,#1d2919,#171a1a 55%);padding:20px}
.progressbar{height:11px;border-radius:999px;background:#303735;overflow:hidden}.progressbar>div{height:100%;background:linear-gradient(90deg,var(--green),var(--green2))}
.metric{font-size:28px;font-weight:1000}.metric-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.workout-list{display:grid;gap:10px}.workout-card{border:1px solid var(--line);background:var(--panel2);border-radius:15px;padding:14px}
.row{display:flex;align-items:center;gap:10px}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.exercise{border:1px solid var(--line);background:var(--panel2);border-radius:15px;padding:14px;margin:10px 0}
.exercise summary{cursor:pointer;font-weight:900;font-size:16px}
.exercise dl{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;margin:12px 0}
.exercise dt{color:var(--muted);font-size:12px}.exercise dd{margin:0}
.steps{counter-reset:step;list-style:none;padding:0;margin:12px 0}
.steps li{position:relative;padding-left:36px;margin:10px 0;min-height:26px}
.steps li:before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;width:25px;height:25px;border-radius:50%;background:var(--green);color:#10200b;display:grid;place-items:center;font-size:12px;font-weight:1000}
.cuebox{border-left:4px solid var(--green);background:#1b2518;padding:10px 12px;border-radius:10px}
.warnbox{border-left:4px solid var(--orange);background:#292016;padding:10px 12px;border-radius:10px}
.search{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#111414;color:var(--text)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}.tabs button{padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:#202423;color:var(--muted)}.tabs button.active{background:var(--green);color:#10200b}
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#111414;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted)}
.timer{display:grid;place-items:center;text-align:center}.timer-display{font-size:54px;font-variant-numeric:tabular-nums;font-weight:1000;letter-spacing:.03em}.timer-controls{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.76);display:none;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex}.modal-card{width:min(720px,100%);max-height:94vh;overflow:auto;background:#151818;border:1px solid #44504b;border-radius:20px;padding:18px}
.coach-step{font-size:12px;color:var(--green2);font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.coach-title{font-size:30px;font-weight:1000;margin:7px 0}.coach-dose{font-size:20px;color:#d9e9d2;font-weight:850}
.coach-instruction{font-size:16px;color:#dce2dd;margin:15px 0}
.coach-progress{height:9px;background:#303735;border-radius:999px;overflow:hidden}.coach-progress div{height:100%;background:var(--green)}
.coach-footer{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px}.toggle input{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#eef8e9;color:#14200e;padding:10px 14px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;z-index:200}.toast.show{opacity:1}
.bottomnav{display:none}
@media(max-width:820px){
 .shell{grid-template-columns:1fr}nav{display:none}main{padding:12px 12px 76px}
 .grid.two,.grid.three,.formgrid{grid-template-columns:1fr}
 header{padding:10px 12px}.brand{min-width:0}.logo{width:42px;height:42px}.header-actions .label{display:none}
 .bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:#111414;border-top:1px solid var(--line);padding:5px}
 .bottomnav button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:8px 2px}.bottomnav button.active{color:var(--green2)}
 .exercise dl{grid-template-columns:95px 1fr}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="logo">MS</div><div><h1>Move Strong</h1><div class="sub">24-week couch-to-calisthenics programme</div></div></div>
 <div class="header-actions">
  <label class="toggle btn small"><input id="awakeToggle" type="checkbox"><span class="label">Keep screen awake</span></label>
  <button class="btn primary" id="quickCoach">Start Coach Mode</button>
 </div>
</header>
<div class="shell">
<nav id="sideNav">
 <button data-page="today" class="active">Today</button>
 <button data-page="programme">Programme</button>
 <button data-page="library">Exercise Library</button>
 <button data-page="progress">Progress</button>
 <button data-page="settings">Settings & Data</button>
</nav>
<main>
<section id="today" class="page active"></section>
<section id="programme" class="page"></section>
<section id="library" class="page"></section>
<section id="progress" class="page"></section>
<section id="settings" class="page"></section>
</main>
</div>
</div>

<div class="bottomnav" id="bottomNav">
 <button data-page="today" class="active">Today</button>
 <button data-page="programme">Plan</button>
 <button data-page="library">Library</button>
 <button data-page="progress">Progress</button>
 <button data-page="settings">More</button>
</div>

<div id="coachModal" class="modal" role="dialog" aria-modal="true">
 <div class="modal-card">
  <div class="row between"><div class="coach-step" id="coachStep"></div><button class="btn small ghost" id="closeCoach">Close</button></div>
  <div class="coach-title" id="coachTitle"></div>
  <div class="coach-dose" id="coachDose"></div>
  <div class="coach-instruction" id="coachInstruction"></div>
  <div id="coachTimerWrap" class="timer" style="display:none">
    <div class="timer-display" id="coachTimer">00:30</div>
    <div class="timer-controls">
      <button class="btn primary" id="coachTimerStart">Start</button>
      <button class="btn" id="coachTimerPause">Pause</button>
      <button class="btn" id="coachTimerReset">Reset</button>
    </div>
  </div>
  <div class="coach-progress"><div id="coachProgress"></div></div>
  <div class="coach-footer">
    <button class="btn" id="coachBack">Back</button>
    <div class="row wrap">
      <button class="btn" id="coachSkip">Skip</button>
      <button class="btn primary" id="coachNext">Done / Next</button>
    </div>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const EX={
 wallPush:{name:"Wall Push-Up",type:"Push",equipment:"Wall",dose:"8–12 reps",purpose:"Introduces the push-up pattern with very little load and teaches you to keep your body aligned.",steps:[
 "Stand facing a wall, roughly one arm’s length away. Place your palms on the wall slightly wider than shoulder width and around chest height.",
 "Walk your feet back a little so your body forms one straight line from the back of your head through your hips to your heels.",
 "Gently brace your stomach. Keep your ribs from flaring and avoid bending at the hips.",
 "Bend your elbows and bring your chest towards the wall. Let the elbows travel diagonally backwards rather than straight out to the sides.",
 "Stop before your shoulders roll forwards or your forehead reaches the wall.",
 "Press the wall away until your arms are straight again. Do not shrug your shoulders.",
 "Move slowly. Breathe in while lowering and breathe out while pushing away."
 ],cue:"Keep your body as one solid plank. Only your elbows and shoulders should create the movement.",mistakes:"Bending at the waist, leading with the head, elbows flaring sideways, shoulders rising towards the ears.",easy:"Stand closer to the wall.",hard:"Move your feet further back or progress to a high counter push-up."},
 counterPush:{name:"Counter Push-Up",type:"Push",equipment:"Stable kitchen worktop or rail",dose:"6–12 reps",purpose:"Builds the strength needed for lower incline and floor push-ups while keeping the movement beginner friendly.",steps:[
 "Use a solid worktop, rail or heavy table that cannot slide. Place your hands slightly wider than shoulder width.",
 "Step your feet back until your body is straight from head to heels. Keep your glutes lightly squeezed.",
 "Brace your middle and look at a point just beyond the edge of the surface.",
 "Bend your elbows and lower your chest towards the edge. Keep the elbows angled about halfway between your ribs and shoulders.",
 "Lower only as far as you can without your hips sagging or your shoulders rounding.",
 "Push firmly through both palms until your elbows straighten.",
 "Reset your body position before the next repetition."
 ],cue:"The lower the surface, the harder the exercise becomes.",mistakes:"Using an unstable surface, hips sagging, chin poking forwards, stopping the rep by letting the stomach hit the edge.",easy:"Use a wall or higher surface.",hard:"Use a sturdy lower table or bench."},
 benchPush:{name:"Bench Incline Push-Up",type:"Push",equipment:"Heavy bench or sturdy low surface",dose:"5–10 reps",purpose:"A stronger incline variation that moves you closer to the demands of a floor push-up.",steps:[
 "Check that the bench or surface cannot move. Place both hands firmly on it, slightly wider than your shoulders.",
 "Step back until your arms are straight and your body is long and rigid.",
 "Tuck your pelvis slightly and brace your stomach so your lower back does not dip.",
 "Lower your chest between your hands by bending your elbows backwards.",
 "Keep your shoulders away from your ears and maintain the same body angle.",
 "Pause briefly near the bottom, then push the bench away until your arms straighten.",
 "Stop the set when you can no longer keep your hips and chest moving together."
 ],cue:"Your chest, hips and thighs should rise and lower together.",mistakes:"Dropping the hips, doing tiny half-reps, flaring elbows, rushing.",easy:"Use a higher surface.",hard:"Use a lower surface or slow the lowering phase to three seconds."},
 kneePush:{name:"Knee Push-Up",type:"Push",equipment:"Mat or carpet",dose:"4–10 reps",purpose:"Introduces floor pressing while reducing the amount of bodyweight you must move.",steps:[
 "Start on hands and knees. Place your hands slightly wider than your shoulders.",
 "Walk your hands forwards until your body forms a straight line from your knees through your hips to your head.",
 "Keep your feet relaxed behind you. Brace your stomach and lightly squeeze your glutes.",
 "Bend your elbows diagonally backwards and lower your chest towards the floor.",
 "Keep your hips travelling with your chest. Do not leave your backside behind.",
 "Lower as far as your strength allows, then press through your palms to return.",
 "Reset your straight line before each repetition."
 ],cue:"Think of this as a full push-up from the knees, not a kneeling chest dip.",mistakes:"Hips staying high, elbows flaring, head dropping, bouncing off the floor.",easy:"Use an incline surface.",hard:"Use slow negatives or progress to an elevated full push-up."},
 negativePush:{name:"Negative Full Push-Up",type:"Push",equipment:"Mat or carpet",dose:"3–6 slow reps",purpose:"Builds full push-up strength by focusing on the lowering phase, which is usually easier than pushing back up.",steps:[
 "Begin in a full high-plank position with hands slightly wider than shoulder width.",
 "Brace your stomach and squeeze your glutes. Keep your feet comfortably apart for stability.",
 "Lower your entire body slowly towards the floor over three to five seconds.",
 "Keep your elbows angled backwards and your body straight.",
 "When your chest reaches the floor, place your knees down.",
 "Return to the starting position using the easiest safe method, then lift your knees again.",
 "Treat every lowering repetition as a separate, controlled effort."
 ],cue:"Own the descent. A smooth five-second lower is more useful than a fast collapse.",mistakes:"Hips dropping first, holding your breath, falling through the final half, trying to push up when form has gone.",easy:"Perform the negative from a raised surface.",hard:"Add a brief pause just above the floor or attempt one full push-up first."},
 fullPush:{name:"Full Push-Up",type:"Push",equipment:"Floor",dose:"1–10 reps",purpose:"Develops chest, shoulder, triceps and core strength using your full bodyweight.",steps:[
 "Place your hands on the floor slightly wider than shoulder width. Extend both legs behind you.",
 "Create a straight line from the back of your head through your hips to your heels.",
 "Brace your stomach, squeeze your glutes and press the floor away so your shoulder blades are stable.",
 "Bend your elbows diagonally backwards and lower your chest towards the floor.",
 "Keep your hips level with your chest throughout the repetition.",
 "Lower until your chest is close to the floor or until you reach the deepest position you can control.",
 "Push strongly through your whole palm and return to straight arms without letting your lower back sag."
 ],cue:"One clean repetition counts more than five shortened or sagging repetitions.",mistakes:"Hips sagging, elbows directly sideways, neck craning, incomplete range, holding breath.",easy:"Use a raised surface or knees.",hard:"Pause at the bottom, slow the tempo or add repetitions."},
 chairSquat:{name:"Chair Squat",type:"Legs",equipment:"Sturdy chair",dose:"8–15 reps",purpose:"Builds leg and hip strength while giving you a safe depth target.",steps:[
 "Place a sturdy chair behind you. Stand about half a foot in front of it with feet roughly shoulder width apart.",
 "Turn your toes slightly out if that feels natural. Keep your whole foot in contact with the floor.",
 "Brace your stomach and lift your chest without arching your lower back.",
 "Push your hips backwards towards the chair, then bend your knees.",
 "Keep your knees travelling in the same direction as your toes.",
 "Lower slowly until your backside lightly touches the chair. Do not relax or drop onto it.",
 "Drive through your whole foot, bring your hips forwards and stand tall.",
 "Squeeze your glutes gently at the top before beginning the next repetition."
 ],cue:"Reach your hips back first, then bend your knees.",mistakes:"Dropping onto the chair, knees collapsing inward, heels lifting, rocking forwards to stand.",easy:"Use a higher chair or cushions.",hard:"Use a lower chair, pause above the seat or progress to a free squat."},
 bodySquat:{name:"Bodyweight Squat",type:"Legs",equipment:"None",dose:"8–20 reps",purpose:"Builds practical lower-body strength, balance and control without using a chair.",steps:[
 "Stand with feet around shoulder width apart and toes turned slightly out.",
 "Brace your stomach and keep your gaze forwards.",
 "Push your hips backwards and bend your knees at the same time.",
 "Keep pressure spread across your heel, the base of your big toe and the base of your little toe.",
 "Lower only as far as you can while keeping your chest controlled and your heels down.",
 "Drive the floor away and bring your hips forwards to stand.",
 "Finish tall without leaning backwards or locking your knees aggressively."
 ],cue:"Use the deepest comfortable range you can control. Depth can improve gradually.",mistakes:"Knees collapsing, heels lifting, rounding heavily, dropping too quickly.",easy:"Use a chair target or hold a support.",hard:"Pause at the bottom, slow the tempo or add repetitions."},
 stepUp:{name:"Low Step-Up",type:"Legs",equipment:"Low stable step",dose:"6–12 each leg",purpose:"Builds single-leg strength, balance and confidence for stairs and daily movement.",steps:[
 "Use a low, solid step that cannot tip or slide. Stand close enough that you do not need to reach forwards.",
 "Place your whole right foot on the step. Your heel must not hang off the edge.",
 "Lean your torso forwards only slightly while keeping your chest lifted.",
 "Press through the foot on the step and lift your body upwards.",
 "Try not to spring strongly from the foot that remains on the floor.",
 "Stand tall on the step with hips level and knee aligned over the toes.",
 "Step down slowly with control. Complete your repetitions, then change legs."
 ],cue:"The leg on the step should perform most of the work.",mistakes:"Pushing hard from the back foot, only placing the toes on the step, knee collapsing inward, dropping quickly down.",easy:"Use a lower step and hold a rail.",hard:"Use a slightly higher step or slower lowering phase."},
 reverseLunge:{name:"Supported Reverse Lunge",type:"Legs",equipment:"Chair, rail or worktop",dose:"5–10 each leg",purpose:"Builds leg strength, hip mobility and balance while support reduces the risk of losing control.",steps:[
 "Stand tall beside a sturdy chair, rail or worktop. Use one or both hands lightly for balance.",
 "Keep your feet around hip width apart rather than standing on one narrow line.",
 "Step one foot backwards and place the ball of that foot on the floor.",
 "Keep most of your weight through the front foot and maintain an upright chest.",
 "Bend both knees and lower the back knee towards the floor only as far as feels comfortable.",
 "Keep the front knee pointing in the same direction as the toes.",
 "Press through the front foot and bring the back foot forwards to return to standing.",
 "Finish all repetitions on one side or alternate sides, depending on your balance."
 ],cue:"Use the support for balance, not to pull your body back up.",mistakes:"Stepping onto a tightrope, front knee collapsing, leaning heavily forwards, pushing mainly from the back leg.",easy:"Use a very short step and shallow depth.",hard:"Use less hand support or increase the depth gradually."},
 gluteBridge:{name:"Glute Bridge",type:"Legs",equipment:"Mat or carpet",dose:"10–15 reps",purpose:"Strengthens the glutes and back of the legs while teaching controlled hip extension.",steps:[
 "Lie on your back with knees bent and feet flat. Place your feet about hip width apart.",
 "Bring your heels close enough that you can almost touch them with your fingertips.",
 "Rest your arms beside you. Gently brace your stomach.",
 "Press through your heels and squeeze your glutes to lift your hips.",
 "Stop when your shoulders, hips and knees form a gentle straight line.",
 "Avoid arching your lower back or pushing your ribs upwards.",
 "Pause for one second, then lower your spine and hips slowly to the floor."
 ],cue:"Lift by squeezing your backside, not by arching your back.",mistakes:"Feet too far away, knees falling outward or inward, overextending the lower back, rushing.",easy:"Use a smaller lift.",hard:"Pause longer at the top or progress to a supported single-leg bridge."},
 calfRaise:{name:"Standing Calf Raise",type:"Legs",equipment:"Wall or chair for balance",dose:"12–20 reps",purpose:"Strengthens the calves and ankles for walking, balance and stair climbing.",steps:[
 "Stand tall beside a wall or chair and use your fingertips lightly for balance.",
 "Place your feet parallel and around hip width apart.",
 "Keep your knees straight but not aggressively locked.",
 "Press through the balls of both feet and raise your heels.",
 "Rise as high as you can without rolling your ankles outward.",
 "Pause briefly at the top.",
 "Lower your heels slowly until they touch the floor, then repeat."
 ],cue:"Move straight up and down. Keep pressure through the big-toe side of each foot.",mistakes:"Bouncing, ankles rolling outward, leaning heavily on the support, tiny rushed repetitions.",easy:"Use both hands for support.",hard:"Use one leg at a time or pause for two seconds at the top."},
 bandRow:{name:"Resistance-Band Row",type:"Pull",equipment:"Resistance band and safe anchor",dose:"8–15 reps",purpose:"Strengthens the upper back and arms and helps balance the pushing work.",steps:[
 "Anchor the resistance band securely at around lower-chest height. Test the anchor before starting.",
 "Hold one handle or end in each hand and step back until the band has light tension.",
 "Stand tall with knees soft, stomach braced and shoulders relaxed.",
 "Begin with arms straight. Pull your elbows backwards close to your sides.",
 "Draw your hands towards your lower ribs while gently bringing your shoulder blades together.",
 "Do not lean backwards or shrug your shoulders.",
 "Pause briefly, then straighten your arms slowly while keeping control of the band."
 ],cue:"Lead with your elbows and keep your ribs stacked over your hips.",mistakes:"Leaning back, shrugging, jerking the band, letting the band snap forwards.",easy:"Use a lighter band or stand closer.",hard:"Use a stronger band or pause with the handles at your ribs."},
 birdDog:{name:"Bird Dog",type:"Core",equipment:"Mat or carpet",dose:"6–10 each side",purpose:"Develops core control, coordination and stability around the hips and lower back.",steps:[
 "Start on hands and knees. Place hands under shoulders and knees under hips.",
 "Spread your fingers and press gently through the floor.",
 "Brace your stomach without holding your breath. Keep your back in a comfortable neutral position.",
 "Slide one leg backwards, then lift it until roughly level with your body.",
 "At the same time, reach the opposite arm forwards.",
 "Keep both hip bones facing the floor and avoid twisting.",
 "Pause, return the hand and knee slowly, then repeat on the opposite side."
 ],cue:"Reach long rather than lifting the arm and leg as high as possible.",mistakes:"Rotating the hips, arching the lower back, lifting too high, rushing side to side.",easy:"Move only one arm or one leg at a time.",hard:"Pause for three to five seconds or draw elbow and knee together under the body."},
 deadBug:{name:"Dead Bug",type:"Core",equipment:"Mat or carpet",dose:"6–10 each side",purpose:"Strengthens the deep abdominal muscles while teaching you to keep your lower back controlled.",steps:[
 "Lie on your back. Lift your feet so your hips and knees are both bent to roughly ninety degrees.",
 "Point both arms towards the ceiling. Let your head rest comfortably.",
 "Gently flatten the space beneath your lower back by bracing your stomach.",
 "Slowly lower one heel towards the floor while reaching the opposite arm overhead.",
 "Move only as far as you can without your lower back lifting away from the floor.",
 "Return your arm and leg to the starting position.",
 "Repeat on the opposite side and breathe steadily throughout."
 ],cue:"Make the movement smaller whenever your lower back begins to arch.",mistakes:"Lower back lifting, moving too quickly, straining the neck, holding breath.",easy:"Move only the legs or tap one heel down at a time.",hard:"Straighten the moving leg or pause just above the floor."},
 inclinePlank:{name:"Incline Plank",type:"Core",equipment:"Stable worktop or bench",dose:"20–60 seconds",timed:30,purpose:"Builds whole-body bracing strength in a position that is easier than a floor plank.",steps:[
 "Place your forearms or hands on a stable raised surface.",
 "Step your feet back until your body forms one straight line.",
 "Keep your shoulders directly over or slightly behind your hands.",
 "Squeeze your glutes and brace your stomach.",
 "Keep your ribs from flaring and avoid letting your hips sag.",
 "Look down slightly so your neck remains long.",
 "Hold while breathing slowly, then step forwards to finish safely."
 ],cue:"Finish the hold when your body shape changes, not when the timer forces you to continue.",mistakes:"Hips sagging, backside too high, shoulders shrugged, holding breath.",easy:"Use a higher surface or shorter hold.",hard:"Use a lower surface or progress to a knee or full floor plank."},
 plank:{name:"Forearm Plank",type:"Core",equipment:"Mat or carpet",dose:"15–90 seconds",timed:30,purpose:"Builds full-body tension and trunk endurance needed for push-ups and everyday movement.",steps:[
 "Place your forearms on the floor with elbows under your shoulders.",
 "Extend your legs behind you and place your feet around hip width apart.",
 "Lift your knees so your body forms a straight line from head to heels.",
 "Brace your stomach and squeeze your glutes.",
 "Push your forearms into the floor and keep your shoulders away from your ears.",
 "Breathe slowly without allowing your lower back to dip.",
 "Lower your knees to finish before your form breaks."
 ],cue:"A shorter, solid plank is more useful than a long sagging plank.",mistakes:"Hips sagging, holding breath, head hanging, shoulders collapsing.",easy:"Keep your knees on the floor or use an incline.",hard:"Increase the time gradually or use a long-lever plank."},
 catCow:{name:"Cat–Cow",type:"Mobility",equipment:"Mat or carpet",dose:"6–10 slow cycles",purpose:"Gently moves the spine and helps you notice the difference between rounding and extending your back.",steps:[
 "Start on hands and knees with hands under shoulders and knees under hips.",
 "For Cow, breathe in and gently tilt your pelvis backwards, allowing your stomach to lower.",
 "Lift your chest slightly and look a little forwards without forcing your neck.",

}

let gen={seconds:60,remaining:60,interval:null,running:false};
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function setGeneral(s){pauseGeneral();gen.seconds=gen.remaining=s;const el=document.getElementById("generalTimer");if(el)el.textContent=fmt(s)}
function startGeneral(){if(gen.running)return;gen.running=true;let end=Date.now()+gen.remaining*1000;syncWake();gen.interval=setInterval(()=>{gen.remaining=Math.max(0,Math.ceil((end-Date.now())/1000));const el=document.getElementById("generalTimer");if(el)el.textContent=fmt(gen.remaining);if(gen.remaining<=0){pauseGeneral();beep();toast("Timer complete")}},250)}
function pauseGeneral(){if(gen.interval)clearInterval(gen.interval);gen.interval=null;gen.running=false;syncWake()}
function resetGeneral(){pauseGeneral();gen.remaining=gen.seconds;const el=document.getElementById("generalTimer");if(el)el.textContent=fmt(gen.remaining)}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=700;g.gain.value=.15;o.start();o.stop(c.currentTime+.25)}catch{}if(navigator.vibrate)navigator.vibrate([150,80,150])}

let coach={items:[],steps:[],index:0,timer:null,remaining:0,duration:0,running:false,title:""};
function buildCoachSteps(items){
 const phWeek=(state.week-1)%4+1,sets=phWeek<=2?2:3,out=[];
 items.forEach((id,ix)=>{
  const e=EX[id];
  const exerciseSets=e.type==="Mobility"?1:sets;
  for(let s=1;s<=exerciseSets;s++){
   out.push({kind:"exercise",id,set:s,total:exerciseSets,title:e.name,dose:e.dose,duration:e.timed||0,instruction:e.steps.slice(0,3).join(" ")+" Key cue: "+e.cue});
   if(s<exerciseSets||ix<items.length-1)out.push({kind:"rest",title:"Rest",dose:state.settings.rest+" seconds",duration:state.settings.rest,instruction:"Relax your grip, breathe slowly and prepare for the next effort."});
  }
 });
 return out;
}
function startCoach(title,items){
 if(typeof items==="string")items=items.replace(/'/g,'"')&&JSON.parse(items.replace(/'/g,'"'));
 coach={items,steps:buildCoachSteps(items),index:0,timer:null,remaining:0,duration:0,running:false,title};
 document.getElementById("coachModal").classList.add("open");showCoachStep();requestWake();
}
function showCoachStep(){
 stopCoachTimer();
 const s=coach.steps[coach.index],e=s.id?EX[s.id]:null;
 coachStep.textContent=`${coach.title} • Step ${coach.index+1} of ${coach.steps.length}`;
 coachTitle.textContent=s.kind==="rest"?"Rest":s.title+(s.total>1?` — Set ${s.set} of ${s.total}`:"");
 coachDose.textContent=s.dose;
 coachInstruction.textContent=s.instruction;
 coachProgress.style.width=((coach.index+1)/coach.steps.length*100)+"%";
 coachBack.disabled=coach.index===0;
 coachNext.textContent=coach.index===coach.steps.length-1?"Finish workout":"Done / Next";
 const timed=s.duration>0;coachTimerWrap.style.display=timed?"grid":"none";
 if(timed){coach.duration=coach.remaining=s.duration;coachTimer.textContent=fmt(s.duration)}
}
function coachAdvance(delta){
 const next=coach.index+delta;
 if(next>=coach.steps.length){finishCoach();return}
 if(next<0)return;coach.index=next;showCoachStep();
}
function finishCoach(){
 const key=dayKey();state.completed[key]=true;save();stopCoachTimer();coachModal.classList.remove("open");releaseWakeIfNeeded();renderToday();toast("Workout complete");
}
function startCoachTimer(){if(coach.running)return;coach.running=true;let end=Date.now()+coach.remaining*1000;requestWake();coach.timer=setInterval(()=>{coach.remaining=Math.max(0,Math.ceil((end-Date.now())/1000));coachTimer.textContent=fmt(coach.remaining);if(coach.remaining<=0){stopCoachTimer();beep();toast("Time complete")}},250)}
function stopCoachTimer(){if(coach.timer)clearInterval(coach.timer);coach.timer=null;coach.running=false}
function resetCoachTimer(){stopCoachTimer();coach.remaining=coach.duration;coachTimer.textContent=fmt(coach.duration)}
closeCoach.onclick=()=>{stopCoachTimer();coachModal.classList.remove("open");releaseWakeIfNeeded()}
coachBack.onclick=()=>coachAdvance(-1);coachSkip.onclick=()=>coachAdvance(1);coachNext.onclick=()=>coachAdvance(1);
coachTimerStart.onclick=startCoachTimer;coachTimerPause.onclick=stopCoachTimer;coachTimerReset.onclick=resetCoachTimer;
quickCoach.onclick=()=>{const w=currentWorkout();startCoach(w.name,w.items)}

let wakeLock=null;
const awakeToggle=document.getElementById("awakeToggle");
awakeToggle.checked=state.settings.awake;
awakeToggle.onchange=()=>{state.settings.awake=awakeToggle.checked;save();syncWake();toast(awakeToggle.checked?"Screen-awake requested":"Screen-awake off")};
async function requestWake(){if(!("wakeLock" in navigator)||document.visibilityState!=="visible")return;try{if(!wakeLock)wakeLock=await navigator.wakeLock.request("screen")}catch{}}
async function releaseWake(){if(wakeLock){try{await wakeLock.release()}catch{}wakeLock=null}}
function anyTimerRunning(){return gen.running||coach.running||document.getElementById("coachModal").classList.contains("open")}
function syncWake(){if(state.settings.awake||anyTimerRunning())requestWake();else releaseWake()}
function releaseWakeIfNeeded(){if(!state.settings.awake&&!anyTimerRunning())releaseWake()}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")syncWake()});
document.addEventListener("pointerdown",()=>{if(state.settings.awake)requestWake()},{once:true});

function renderAll(){renderToday();renderProgramme();renderLibrary();renderProgress();renderSettings();awakeToggle.checked=state.settings.awake}
renderAll();setGeneral(state.settings.rest);syncWake();
</script>
</body></html>
